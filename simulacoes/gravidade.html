<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Metadados da Página -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimento Planetário 3D — Gravitação Universal</title>

    <meta name="description"
        content="Simulação 3D de órbitas planetárias sob a gravitação universal de Newton. Visualize vetores de posição e velocidade e acompanhe o gráfico de energia cinética e potencial em tempo real.">
    <meta name="keywords"
        content="gravitação 3D, órbitas planetárias, leis de kepler, mecânica celeste, energia cinética, energia potencial, simulação física, vetores">
    <meta name="author" content="Nicolas Heringer">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Estilos CSS e Libs -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/gravidade.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Cabeçalho da Simulação -->
    <header class="sim-header">
        <a href="../index.html#secao-simulacoes" class="btn-back">← Voltar ao Hub</a>
        <span class="sim-title">Movimento Planetário (Gravidade 3D)</span>
    </header>

    <!-- Conteúdo Principal -->
    <main class="sim-layout">
        <!-- Área de Visualização 3D (Canvas) -->
        <div class="canvas-area">
            <canvas id="simulationCanvas"></canvas>
        </div>

        <!-- Painel de Controles e Gráficos -->
        <div class="side-panel">
            <div class="controls-section">
                <h3>Controles</h3>
                <label>
                    <input type="checkbox" id="showPosition"> Mostrar Vetor Posição
                </label>
                <label>
                    <input type="checkbox" id="showVelocity"> Mostrar Vetor Velocidade
                </label>
            </div>
            <div class="chart-section">
                <h3>Energia Cinética (K)</h3>
                <div class="chart-wrapper">
                    <canvas id="kineticChart"></canvas>
                </div>
                
                <h3>Energia Potencial (U)</h3>
                <div class="chart-wrapper">
                    <canvas id="potentialChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- Script da Simulação -->
    <script src="scripts/gravidade.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação 3D de Movimento Planetário</title>

    <meta name="description" content="Plataforma de simulações educacionais de física e matemática.">
    <meta name="keywords"
        content="simulações, física, matemática, educação, partículas, átomo de hidrogênio, áudio, fônons">
    <meta name="author" content="Nicolas Heringer">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/gravidade.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header class="sim-header">
        <a href="../index.html#secao-simulacoes" class="btn-back">← Voltar ao Hub</a>
        <span class="sim-title">Movimento Planetário (Gravidade 3D)</span>
    </header>

    <main class="sim-layout">
        <div class="canvas-area">
            <canvas id="simulationCanvas"></canvas>
        </div>
        <div class="side-panel">
            <div class="controls-section">
                <h3>Controles</h3>
                <label>
                    <input type="checkbox" id="showPosition"> Mostrar Vetor Posição
                </label>
                <label>
                    <input type="checkbox" id="showVelocity"> Mostrar Vetor Velocidade
                </label>
            </div>
            <div class="chart-section">
                <h3>Energia Cinética (K)</h3>
                <div class="chart-wrapper">
                    <canvas id="kineticChart"></canvas>
                </div>
                
                <h3>Energia Potencial (U)</h3>
                <div class="chart-wrapper">
                    <canvas id="potentialChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script src="scripts/gravidade.js"></script>
</body>

</html>

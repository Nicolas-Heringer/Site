<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Metadados da Página -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ondas Estacionárias 2D — Padrões de Chladni</title>

    <meta name="description"
        content="Simulação de ondas estacionárias bidimensionais em superfícies quadradas. Visualize os padrões modais e linhas nodais de Chladni para diferentes modos de vibração n e m.">
    <meta name="keywords"
        content="ondas estacionárias, figuras de chladni, padrões modais, linhas nodais, vibração 2D, acústica, física ondulatória">
    <meta name="author" content="Nicolas Heringer">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/estacionarias2d.css">

    <!-- Suporte a LaTeX com KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
        });"></script>
</head>

<body>
    <!-- Cabeçalho da Simulação -->
    <header class="sim-header">
        <a href="../index.html#secao-simulacoes" class="btn-back">← Voltar ao Hub</a>
        <span class="sim-title">Ondas Estacionárias 2D</span>
    </header>

    <!-- Conteúdo Principal -->
    <main class="sim-layout">
        <!-- Área de Visualização (Canvas) -->
        <div class="canvas-area">
            <canvas id="simulacao" width="600" height="600"></canvas>
        </div>

        <!-- Painel de Controles -->
        <aside class="controls-panel">
            <div class="control-group">
                <label for="n">Modo n:</label>
                <input type="number" id="n" class="sim-input" value="1" min="1" max="10">
            </div>

            <div class="control-group">
                <label for="m">Modo m:</label>
                <input type="number" id="m" class="sim-input" value="5" min="1" max="10">
            </div>

            <div class="control-group">
                <label for="drawType">Tipo de desenho:</label>
                <select id="drawType" class="sim-control">
                    <option value="mapped">Escala de cinza</option>
                    <option value="abs">Nós das ondas</option>
                    <option value="positiveAndNegative">Positivo e negativo</option>
                </select>
            </div>

            <div class="control-group">
                <button id="atualizar" class="sim-btn">Atualizar</button>
            </div>

            <div class="info-section">
                <p>Visualização de padrões de Chladni (ondas estacionárias bidimensionais em uma superfície quadrada).
                </p>
                <p>Referência: <a href="https://doi.org/10.1590/1806-9126-RBEF-2023-0354">Aqui</a></p>
            </div>
        </aside>
    </main>

    <!-- Script da Simulação -->
    <script type="text/javascript" src="scripts/estacionarias2d.js"></script>
</body>

</html>

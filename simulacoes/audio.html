<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Análise de Áudio em Tempo Real</title>

    <meta name="description" content="Plataforma de simulações educacionais de física e matemática.">
    <meta name="keywords"
        content="simulações, física, matemática, educação, partículas, átomo de hidrogênio, áudio, fônons">
    <meta name="author" content="Nicolas Heringer">

    <link rel="stylesheet" href="css/base.css">
    <style>
        .audio-canvas-container {
            position: relative;
            margin: 20px 0;
            width: 90%;
            height: 40%;
        }

        .audio-canvas-container canvas {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background-color: #000;
        }

        .axis-label {
            position: absolute;
            font-size: 12px;
            color: #fff;
        }

        .sim-btn--accent {
            background: linear-gradient(135deg, #1a3a5c, #0d6efd);
            border: 1px solid #4da3ff;
            color: #fff;
            font-weight: bold;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .sim-btn--accent:hover {
            background: linear-gradient(135deg, #0d6efd, #00c8ff);
            box-shadow: 0 0 12px rgba(0, 200, 255, 0.5);
        }

        #freqCanvas {
            transition: box-shadow 0.3s;
        }

        #freqCanvas.generator-active {
            box-shadow: 0 0 0 2px #4da3ff, 0 0 20px rgba(77, 163, 255, 0.2);
        }
    </style>
</head>

<body>
    <header class="sim-header">
        <a href="../index.html#secao-simulacoes" class="btn-back">← Voltar ao Hub</a>
        <span class="sim-title">Análise de Áudio em Tempo Real</span>
    </header>

    <main class="sim-layout">
        <div class="canvas-area" style="justify-content: space-evenly;">
            <div class="audio-canvas-container" id="canvasContainer1">
                <canvas id="timeCanvas"></canvas>
            </div>

            <div class="audio-canvas-container" id="canvasContainer2">
                <canvas id="freqCanvas"></canvas>
            </div>
        </div>

        <aside class="controls-panel">
            <div class="control-group">
                <button id="modeButton" class="sim-btn sim-btn--accent">⚡ Modo: Análise</button>
            </div>
            <div class="control-group">
                <button id="startButton" class="sim-btn">▶ Iniciar</button>
            </div>
            <div class="control-group">
                <button id="stopButton" class="sim-btn" disabled>⏹ Parar</button>
            </div>
            <div class="control-group" id="clearGroup" style="display:none;">
                <button id="clearButton" class="sim-btn">🗑 Limpar Sinal</button>
            </div>
            <div class="control-group">
                <button id="scaleButton" class="sim-btn">Escala: Linear</button>
            </div>
            <div class="info-section">
                <p id="infoText">Nesta simulação é possível visualizar um som capturado pelo microfone e seu respectivo espectro de
                    frequências usando a Transformada de Fourier.</p>
            </div>
        </aside>
    </main>

    <script src="scripts/audio.js"></script>
</body>

</html>

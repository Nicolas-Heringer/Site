<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Metadados da Página -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Análise de Áudio e Sintetizador Espectral</title>

    <meta name="description"
        content="Simulação e análise de sinal de áudio em tempo real via Web Audio API. Visualização espectral FFT, forma de onda no tempo e sintetizador aditivo interativo.">
    <meta name="keywords"
        content="análise de áudio, FFT, transformada de Fourier, Web Audio API, espectrograma, sintetizador, frequência, osciloscópio, simulação">
    <meta name="author" content="Nicolas Heringer">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/audio.css">
</head>

<body>
    <!-- Cabeçalho da Simulação -->
    <header class="sim-header">
        <a href="../index.html#secao-simulacoes" class="btn-back">← Voltar ao Hub</a>
        <span class="sim-title">Análise de Áudio em Tempo Real</span>
    </header>

    <!-- Conteúdo Principal -->
    <main class="sim-layout">
        <!-- Área de Visualização (Canvases do Domínio do Tempo e Frequência) -->
        <div class="canvas-area">
            <div class="audio-canvas-container" id="canvasContainer1">
                <canvas id="timeCanvas"></canvas>
            </div>

            <div class="audio-canvas-container" id="canvasContainer2">
                <canvas id="freqCanvas"></canvas>
            </div>
        </div>

        <!-- Painel de Controles -->
        <aside class="controls-panel">
            <div class="control-group">
                <button id="modeButton" class="sim-btn sim-btn--accent">⚡ Modo: Análise</button>
            </div>
            <div class="control-group">
                <button id="startButton" class="sim-btn">▶ Iniciar</button>
            </div>
            <div class="control-group">
                <button id="stopButton" class="sim-btn" disabled>⏹ Parar</button>
            </div>
            <div class="control-group" id="clearGroup">
                <button id="clearButton" class="sim-btn">🗑 Limpar Sinal</button>
            </div>
            <div class="control-group">
                <button id="scaleButton" class="sim-btn">Escala: Linear</button>
            </div>
            <div class="info-section">
                <p id="infoText">Nesta simulação é possível visualizar um som capturado pelo microfone e seu respectivo espectro de
                    frequências usando a Transformada de Fourier.</p>
            </div>
        </aside>
    </main>

    <!-- Script da Simulação -->
    <script src="scripts/audio.js"></script>
</body>

</html>

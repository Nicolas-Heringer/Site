<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Metadados da Página -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modelo de Drude — Condução Elétrica em Redes Cristalinas</title>

    <meta name="description"
        content="Simulação do modelo clássico de Drude para condução elétrica em metais e redes cristalinas. Observe o efeito do campo elétrico, agitação térmica e colisões em redes triangulares, hexagonais e armchair.">
    <meta name="keywords"
        content="modelo de drude, condução elétrica, elétrons livres, campo elétrico, velocidade de deriva, rede cristalina, grafeno, física da matéria condensada">
    <meta name="author" content="Nicolas Heringer">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/drude.css">

    <!-- Suporte a LaTeX com KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
        });"></script>
</head>

<body>
    <!-- Cabeçalho da Simulação -->
    <header class="sim-header">
        <a href="../index.html#secao-simulacoes" class="btn-back">← Voltar ao Hub</a>
        <span class="sim-title">Modelo de Drude</span>
    </header>

    <!-- Conteúdo Principal -->
    <main class="sim-layout">
        <!-- Área de Visualização (Canvas) -->
        <div class="canvas-area">
            <canvas id="drudeCanvas"></canvas>
        </div>

        <!-- Painel de Controles -->
        <aside class="controls-panel">
            <div class="info-section">
                <p>Simulação do modelo clássico de condução elétrica (Modelo de Drude).</p>
            </div>

            <!-- SENTIDO DO CAMPO ELÉTRICO -->
            <div class="control-group">
                <label>Sentido do Campo Elétrico ($\vec{E}$):</label>
                <div class="segmented-control" id="dirCampoControl">
                    <button type="button" class="segment-btn" data-dir="-1"
                        title="Campo para a Esquerda">$\leftarrow$</button>
                    <button type="button" class="segment-btn active" data-dir="0" title="Campo Desligado">$0$</button>
                    <button type="button" class="segment-btn" data-dir="1"
                        title="Campo para a Direita">$\rightarrow$</button>
                </div>
            </div>

            <!-- INTENSIDADE DO CAMPO -->
            <div class="control-group">
                <label for="intensidadeCampo">
                    Intensidade do Campo ($|E|$): <strong><span id="valIntensidadeCampo">0.20</span></strong>
                </label>
                <input type="range" id="intensidadeCampo" class="sim-slider" min="0.05" max="1.00" step="0.05"
                    value="0.20">
            </div>

            <!-- TEMPERATURA / AGITAÇÃO TÉRMICA -->
            <div class="control-group">
                <label for="temperatura">
                    Temperatura (Agitação Térmica): <strong><span id="valTemp">0</span></strong>
                </label>
                <input type="range" id="temperatura" class="sim-slider" min="0" max="100" step="1" value="0">
            </div>

            <div class="control-group">
                <label for="tipoRede">Tipo de Rede:</label>
                <select id="tipoRede" class="sim-control">
                    <option value="triangular">Triangular</option>
                    <option value="hexagonal">Hexagonal (Grafeno)</option>
                    <option value="armchair">Armchair</option>
                </select>
            </div>

            <div class="control-group">
                <button id="btnZerar" class="sim-btn">Zerar Velocidades</button>
            </div>
        </aside>
    </main>

    <!-- Script da Simulação -->
    <script src="scripts/drude.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Metadados da Página -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queda Livre Interativa e Lançamento de Corpos</title>

    <meta name="description"
        content="Simulação física de queda livre sob aceleração gravitacional com colisões elásticas/inelásticas nas bordas e arremesso interativo de objetos.">
    <meta name="keywords"
        content="queda livre, gravidade, cinemática, colisão elástica, coeficiente de restituição, velocidade, simulação interativa">
    <meta name="author" content="Nicolas Heringer">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/quedalivre.css">

    <!-- Suporte a LaTeX com KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
        });"></script>
</head>

<body>
    <!-- Cabeçalho da Simulação -->
    <header class="sim-header">
        <a href="../index.html#secao-simulacoes" class="btn-back">← Voltar ao Hub</a>
        <span class="sim-title">Queda Livre Interativa</span>
    </header>

    <!-- Conteúdo Principal -->
    <main class="sim-layout">
        <!-- Área de Visualização (Canvas) -->
        <div class="canvas-area">
            <canvas id="simulacao" width="600" height="600"></canvas>
        </div>

        <!-- Painel de Informações -->
        <aside class="controls-panel">
            <div class="info-section">
                <p>Nesta simulação é possível interagir com um objeto submetido à força da gravidade (queda livre).</p>
            </div>
        </aside>
    </main>

    <!-- Script da Simulação -->
    <script type="text/javascript" src="scripts/quedalivre.js"></script>
</body>

</html>

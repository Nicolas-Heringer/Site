<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queda Livre Interativa</title>

    <meta name="description" content="Plataforma de simulações educacionais de física e matemática.">
    <meta name="keywords"
        content="simulações, física, matemática, educação, partículas, átomo de hidrogênio, áudio, fônons">
    <meta name="author" content="Nicolas Heringer">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" type="text/css" href="css/quedalivre.css">
</head>

<body>
    <header class="sim-header">
        <a href="../index.html#secao-simulacoes" class="btn-back">← Voltar ao Hub</a>
        <span class="sim-title">Queda Livre Interativa</span>

    <main class="sim-layout">
        <div class="canvas-area">
            <canvas id="simulacao" width="600" height="600"></canvas>

    <script type="text/javascript" src="scripts/quedalivre.js"></script>

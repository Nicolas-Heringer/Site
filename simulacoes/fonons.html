<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Metadados da Página -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulação de Fônons e Modos de Vibração</title>

    <meta name="description"
        content="Simulação interativa de fônons e modos normais de vibração em redes cristalinas 2D monoatômicas e diatômicas. Interaja com as partículas para observar ondas de matéria e condutividade térmica.">
    <meta name="keywords"
        content="fônons, rede cristalina, modos de vibração, ondas de matéria, dinâmica de redes, rede monoatômica, rede diatômica, física do estado sólido">
    <meta name="author" content="Nicolas Heringer">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/fonons.css">

    <!-- Suporte a LaTeX com KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
        });"></script>
</head>

<body>

    <!-- Cabeçalho da Simulação -->
    <header class="sim-header">
        <a href="../index.html#secao-simulacoes" class="btn-back">← Voltar ao Hub</a>
        <span class="sim-title">Simulação de fônons</span>
    </header>

    <!-- Conteúdo Principal -->
    <main class="sim-layout">
        <!-- Área de Visualização (Canvas) -->
        <div class="canvas-area">
            <canvas id="myCanvas" width="900" height="600"></canvas>
        </div>

        <!-- Painel de Controles -->
        <aside class="controls-panel">

            <div class="control-group">
                <label for="seletor-de-template">Template (Tamanho da rede):</label>
                <select id="seletor-de-template" class="sim-control">
                    <option value="uniforme_10">Monoatômica (Grid 10)</option>
                    <option value="uniforme_20">Monoatômica (Grid 20)</option>
                    <option value="uniforme_50" selected>Monoatômica (Grid 50)</option>
                    <option value="linhas_20">Diatômica Linhas (Grid 20)</option>
                    <option value="linhas_50">Diatômica Linhas (Grid 50)</option>
                    <option value="checkerboard_20">Diatômica Checkerboard (Grid 20)</option>
                    <option value="checkerboard_50">Diatômica Checkerboard (Grid 50)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Raio de Influência:</label>
                <input type="range" id="raioInput" class="sim-slider" min="20" max="200" value="80">
            </div>

            <div class="control-group">
                <label>Intensidade da vibração:</label>
                <input type="range" id="intensidadeInput" class="sim-slider" min="100" max="500" value="300">
            </div>

            <div class="control-group">
                <button id="btn-reset" class="sim-btn">Resetar Grid</button>
                <button id="btn-pause" class="sim-btn">Pausar</button>
            </div>

            <div class="info-section">
                <p>O objetivo desta simulação é ilustrar como a temperatura (energia térmica) se associa à propagação de
                    ondas de matéria (fônons) em uma rede cristalina.</p>
            </div>

        </aside>
    </main>

    <!-- Script da Simulação -->
    <script src="scripts/fonons.js"></script>
</body>

</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Órbita 1 (Física - Azul/Ciano) -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#63b3ed" stroke-width="2.5" transform="rotate(-30 32 32)" opacity="0.95" />

  <!-- Órbita 2 (Matemática - Roxo) -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#9a75f8" stroke-width="2.5" transform="rotate(30 32 32)" opacity="0.95" />

  <!-- Núcleo Central com Brilho (Amarelo) -->
  <circle cx="32" cy="32" r="5" fill="#facc15" filter="url(#glow)"/>

  <!-- Partículas / Elétrons -->
  <circle cx="16" cy="23" r="2.5" fill="#63b3ed"/>
  <circle cx="48" cy="23" r="2.5" fill="#9a75f8"/>
</svg>

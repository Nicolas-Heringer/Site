<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .mouse-wheel-roller {
      animation: wheelRollAnim 1.6s ease-in-out infinite;
    }
    .mouse-wheel-arrow {
      animation: wheelArrowAnim 1.6s ease-in-out infinite;
    }
    @keyframes wheelRollAnim {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(1.5px);
      }
    }
    @keyframes wheelArrowAnim {
      0%, 100% {
        transform: translateY(-1px);
        opacity: 0.4;
      }
      50% {
        transform: translateY(1.5px);
        opacity: 1;
      }
    }
  </style>
  <rect x="5" y="2" width="14" height="20" rx="7"/>
  <rect class="mouse-wheel-roller" x="10.5" y="5" width="3" height="6" rx="1.5" fill="currentColor" fill-opacity="0.4"/>
  <path d="M5 10h4.5"/>
  <path d="M14.5 10H19"/>
  <path class="mouse-wheel-arrow" d="M10 16l2 2 2-2"/>
</svg>

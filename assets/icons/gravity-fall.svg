<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .fall-object {
      animation: freeFallAnim 1.8s cubic-bezier(0.45, 0, 0.9, 1) infinite;
    }
    .fall-trails {
      animation: fallTrailAnim 1.8s ease-in-out infinite;
    }
    @keyframes freeFallAnim {
      0% {
        transform: translateY(-5px);
        opacity: 0.3;
      }
      25% {
        opacity: 1;
      }
      80%, 100% {
        transform: translateY(6px);
      }
    }
    @keyframes fallTrailAnim {
      0%, 100% {
        opacity: 0.2;
      }
      50% {
        opacity: 0.75;
      }
    }
  </style>
  <line x1="4" y1="21" x2="20" y2="21" stroke-dasharray="2 2" stroke-opacity="0.4"/>
  <g class="fall-trails" stroke-opacity="0.5">
    <line x1="8" y1="3" x2="8" y2="8"/>
    <line x1="16" y1="3" x2="16" y2="8"/>
  </g>
  <g class="fall-object">
    <circle cx="12" cy="8" r="3.5" fill="currentColor" fill-opacity="0.25"/>
    <path d="M12 11.5v5m-1.8-1.8l1.8 1.8 1.8-1.8"/>
  </g>
</svg>

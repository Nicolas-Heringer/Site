<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .oscillate-body {
      animation: harmonicSwayAnim 2.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    @keyframes harmonicSwayAnim {
      0%, 100% {
        transform: translateX(-5.5px);
      }
      50% {
        transform: translateX(5.5px);
      }
    }
  </style>
  <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <line x1="4" y1="8.5" x2="4" y2="15.5" stroke="currentColor" stroke-opacity="0.5"/>
  <line x1="20" y1="8.5" x2="20" y2="15.5" stroke="currentColor" stroke-opacity="0.5"/>
  <circle class="oscillate-body" cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .chladni-nodes {
      animation: chladniVibeAnim 2.2s ease-in-out infinite;
    }
    @keyframes chladniVibeAnim {
      0%, 100% {
        opacity: 0.45;
      }
      50% {
        opacity: 0.95;
      }
    }
  </style>
  <rect x="3" y="3" width="18" height="18" rx="2.5"/>
  <g class="chladni-nodes">
    <circle cx="12" cy="12" r="5" stroke-dasharray="3 2" stroke-opacity="0.8"/>
    <line x1="3" y1="12" x2="21" y2="12" stroke-opacity="0.6"/>
    <line x1="12" y1="3" x2="12" y2="21" stroke-opacity="0.6"/>
  </g>
</svg>

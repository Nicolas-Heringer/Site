<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .orbital-lobes {
      transform-origin: 12px 12px;
      animation: orbitalPulseAnim 3.4s ease-in-out infinite;
    }
    @keyframes orbitalPulseAnim {
      0%, 100% {
        transform: scale(0.92) rotate(0deg);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.06) rotate(12deg);
        opacity: 1;
      }
    }
  </style>
  <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
  <g class="orbital-lobes">
    <ellipse cx="12" cy="7.5" rx="3.5" ry="4.5" fill="currentColor" fill-opacity="0.2"/>
    <ellipse cx="12" cy="16.5" rx="3.5" ry="4.5" fill="currentColor" fill-opacity="0.2"/>
    <ellipse cx="7.5" cy="12" rx="4.5" ry="3.5" stroke-dasharray="2 3" stroke-opacity="0.5"/>
    <ellipse cx="16.5" cy="12" rx="4.5" ry="3.5" stroke-dasharray="2 3" stroke-opacity="0.5"/>
  </g>
</svg>

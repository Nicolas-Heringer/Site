<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .slider-knob-1 {
      animation: knobSlide1 3.2s ease-in-out infinite alternate;
    }
    .slider-knob-2 {
      animation: knobSlide2 2.8s ease-in-out infinite alternate;
    }
    .slider-knob-3 {
      animation: knobSlide3 3.6s ease-in-out infinite alternate;
    }
    @keyframes knobSlide1 {
      0% { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }
    @keyframes knobSlide2 {
      0% { transform: translateY(0); }
      100% { transform: translateY(3.5px); }
    }
    @keyframes knobSlide3 {
      0% { transform: translateY(0); }
      100% { transform: translateY(-2.5px); }
    }
  </style>
  <line x1="6" y1="3" x2="6" y2="21" stroke-opacity="0.45"/>
  <circle class="slider-knob-1" cx="6" cy="8" r="2.5" fill="currentColor"/>
  <line x1="12" y1="3" x2="12" y2="21" stroke-opacity="0.45"/>
  <circle class="slider-knob-2" cx="12" cy="15" r="2.5" fill="currentColor"/>
  <line x1="18" y1="3" x2="18" y2="21" stroke-opacity="0.45"/>
  <circle class="slider-knob-3" cx="18" cy="10" r="2.5" fill="currentColor"/>
</svg>
